# fleetsmith fleet spec — full-featured example
# Build:    node src/cli.js build fleet.example.yaml --target all --out ./dist-example
# Validate: node src/cli.js validate fleet.example.yaml

version: 1

fleet:
  name: api-hardening
  domain: "REST API security and reliability hardening"
  pattern: pipeline          # pipeline | fanout | expert-pool | generate-verify | supervisor | hierarchical
  execution: hybrid          # team | subagents | hybrid
  workspace: _fleet
  schedule:                  # recurring loop — omit for a one-shot fleet
    cron: "0 3 * * 1"        # weekly Monday 03:00; or use `interval: 6h`, or neither for self-paced
    note: "re-scan the API surface for new endpoints and regressions since last week"

defaults:
  model: inherit             # smart | fast | cheap | inherit — a relative intent, not a model name
  capabilities: { read: true }

  # Tiers stay unbound by default: every agent inherits the model of whatever
  # session or agent invoked it. That is what makes a fleet portable — a pinned
  # model overrides the user's choice and fails outright where it is not on
  # their plan or provider.
  #
  # Uncomment a map to bind this fleet's tiers to real models. Supplying one is
  # the decision to pin; tiers you leave out fall back to the conventional
  # alias for that target.
  #
  # claudeModels:   { smart: opus, fast: sonnet, cheap: haiku }
  # opencodeModels: { smart: anthropic/claude-opus-5, cheap: anthropic/claude-haiku-4-5 }
  # gooseModels:    { smart: claude-opus-5, cheap: claude-haiku-4-5 }

agents:
  - name: threat-analyst
    role: Maps the API surface and produces a prioritized threat model.
    goal: A threat model where every entry names an endpoint, an attack class, and observable evidence.
    model: smart
    capabilities: { read: true, web: true }
    skills: [threat-modeling]
    handoff:
      to: [hardening-engineer]
      artifact: 01-threat-model.md
      criteria:
        - Every threat names endpoint + attack class + evidence
        - Threats ranked by exploitability x impact

  - name: hardening-engineer
    role: Implements mitigations for the ranked threats.
    goal: Each mitigation implemented, tested, and traceable to its threat entry.
    model: smart
    capabilities: { read: true, edit: true, run: true }
    skills: [secure-remediation, grid-awareness]
    handoff:
      to: [security-verifier]
      artifact: 02-mitigations.md
      criteria:
        - Every mitigation maps to a threat-model entry
        - Repro/verify steps included per mitigation

  - name: security-verifier
    role: Adversarially verifies mitigations — tries to bypass them, not just confirm they exist.
    goal: A verdict per mitigation with reproducible evidence.
    model: smart
    capabilities: { read: true, run: true }
    skills: []
    principles:
      - Attempt at least one bypass per mitigation before marking it effective
      - Evidence is a command + output, never an assertion
    handoff:
      to: []
      artifact: 03-verification-report.md

skills:
  - name: threat-modeling
    description: >
      Methodology for API threat modeling: surface enumeration, attack-class
      mapping (OWASP API Top 10), exploitability x impact ranking. Use whenever
      analyzing an API for security risks, producing or updating a threat model,
      or re-ranking threats after mitigations land.
    body: |
      # Threat modeling

      1. Enumerate the surface from routes/controllers, not docs — docs lie.
      2. For each endpoint: auth requirement, input channels, data sensitivity.
      3. Map each endpoint against OWASP API Top 10 classes; record only
         plausible pairings with evidence (code path or config).
      4. Rank: exploitability (unauthenticated? automatable?) x impact
         (data class, blast radius). Ties break toward unauthenticated access.
    references:
      owasp-api-top10.md: |
        # OWASP API Top 10 quick map
        (populate per project: class -> what to grep for in this stack)

  - name: secure-remediation
    description: >
      Implementation patterns for API security mitigations: input validation,
      authz checks, rate limiting, secrets handling. Use when implementing or
      updating fixes for threat-model findings.
    body: |
      # Secure remediation

      - Fix the class, not the instance: a missing authz check on one endpoint
        means auditing the whole router for the same gap.
      - Prefer framework-native guards over hand-rolled checks; note why when
        deviating.
      - Every mitigation ships with a failing-then-passing test proving it.

  - name: grid-awareness
    description: >
      Methodology for reading `_fleet/local/grid/GRID.md` (multi-developer sync) and
      responding to another developer's in-flight work before claiming a task. Use
      whenever GRID.md lists a peer actor working on overlapping files or symbols,
      when checking whether someone else is already touching a file or symbol,
      before creating a new utility or helper that might already exist on a peer's
      branch, when deciding whether to depend on another actor's task (the
      `depends on: @<actor>#<task-seq>` ledger notation), when interpreting a
      `(stale)` actor or an `unreachable` grid header, or before finalizing an
      artifact to check whether anyone has already run into trouble with the
      same file.
    triggers:
      should:
        - "GRID.md shows bob already has an in-progress task touching the same files as mine — what should I do?"
        - "before I write a new retry-helper utility, check if another developer's fleet already built one"
        - "is anyone else's fleet currently touching the same file as me?"
        - "how do I declare a dependency on another actor's task using the @actor#seq notation"
        - "alice's presence in GRID.md is marked stale — does that still count as an overlap?"
        - "before finalizing this handoff, recall any past lessons or failures tied to the files it touches"
      shouldNot:
        - "enumerate the API surface and map it to OWASP API Top 10 attack classes"
        - "implement rate limiting and input validation for this endpoint"
        - "rank these threats by exploitability and impact"
        - "add a failing-then-passing test proving this mitigation works"
        - "verify this mitigation actually blocks the attack, not just that the code exists"
    body: |
      # Grid awareness

      Multi-developer sync (the "grid") projects every other developer's in-flight
      work into `_fleet/local/grid/` before anyone commits. Read it before claiming
      work; it tells you who else is touching what, right now.

      ## Reading GRID.md

      `_fleet/local/grid/GRID.md` has three parts:

      | Section | What it tells you |
      |---|---|
      | Header | Sync timestamp, cortex reachability, active actor count |
      | Per-actor (`## <actor>`) | Their in-progress tasks, declared files/symbols, staleness |
      | Cross-actor dependencies | Every `@<actor>#<seq>` reference found in any ledger |

      - An actor marked `(stale — last seen <time>)` has probably gone idle (no
        heartbeat within the staleness TTL) — treat their declared work as unlikely
        to still be in flight, not as gone for good.
      - If the header reads `⚠ unreachable since <time>`, or GRID.md does not exist
        at all: the cortex is down, or this fleet has no grid configured. Proceed
        exactly as if you were the only developer. Grid state is advisory, never a
        blocker — its absence changes nothing about how you work.

      ## Overlap response protocol

      Before claiming a task, compare its declared files/symbols against every
      active peer's in-progress entries in GRID.md.

      | Overlap kind | What to do |
      |---|---|
      | Same file(s), different symbols | Mention it in your handoff's Context digest (e.g. "bob is also editing src/x.js — coordinate before merging") and consider narrowing your own scope to reduce the chance of a large diff collision. |
      | Same symbol name | Do not implement it yet. Recall with `purpose: cross_dev_reuse` naming the symbol first — the peer's artifact may already cover what you need. If it does, prefer depending on it over re-implementing. If it genuinely does not, say so in your handoff and proceed. |

      Never silently duplicate a symbol a peer has already declared — that is
      exactly the wasted work the grid exists to prevent.

      ## Cross-actor dependency notation

      Declare a dependency on another actor's in-progress task in your OWN ledger
      row's `Depends on` column:

      ```
      depends on: @<actor>#<task-seq>
      ```

      Example: `depends on: @bob#4` means "this task depends on bob's task #4."

      This is advisory, not a lock: bob is not notified, and nothing technically
      blocks you from proceeding regardless. It binds only when the work reaches
      the staging merge — the promotion ladder is what turns an advisory
      dependency into a real one.

      ## Reuse-before-write

      Before creating a new utility, helper, or shared abstraction: one recall,
      `purpose: cross_dev_reuse`, naming the symbol or capability you are about to
      build. Cite the result in your handoff's Context digest — either what you
      found (and why you're using it, extending it, or deliberately not), or "no
      existing implementation found" if recall returned nothing. Skipping this
      step is how two developers end up maintaining two slightly-different date
      parsers.

      ## Pre-handoff regression check

      Before finalizing your artifact, for each file it touches: one recall,
      naming the file path and its key symbols as the query, `purpose:
      regression_check`, `limit: 5`. This is the honest version of "anticipate
      future bugs" — it does not predict anything, it surfaces what already went
      wrong here before.

      - On the RelataDB backend this spans team lessons, past run failures, and
        org decisions touching the file — ranked by the engine's confidence x
        recency.
      - On the file backend (no grid configured) the identical call degrades to
        token-overlap search over `_fleet/shared/playbooks/` — same instruction,
        a smaller corpus, still useful.

      Cite any hit naming the same file or symbol in your handoff's Context
      digest or Failed approaches section — quote or closely paraphrase what
      went wrong before, not just "see recall results." If nothing relevant
      comes back, write "regression check: clean" in the Context digest anyway:
      the step must stay visible whether or not it found something, or a
      reviewer cannot tell a real clean bill of health from a skipped step.

orchestrator:
  name: run-api-hardening
  trigger: API security hardening, threat modeling, or mitigation verification
  phases:
    - name: Threat modeling
      mode: subagents
      agents: [threat-analyst]
      gate: Threat model contains at least one HIGH item with evidence, or explicitly states the surface is clean.
    - name: Remediation + verification
      mode: subagents
      agents: [hardening-engineer, security-verifier]
      loop:                  # iteration loop — refine until the exit condition holds
        until: "security-verifier reports every mitigation effective with reproducible evidence; no mitigation is bypassable"
        max: 3               # hard iteration bound (validator warns above 10)
        check: "npm test"    # optional shell signal; exit 0 = satisfied. On goose this becomes a native retry.checks entry
      gate: Every mitigation has a verdict with evidence.

handover:
  strategy: file
  ledger: true
