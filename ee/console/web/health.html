<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8" />
<title>fleetsmith grid — deployment health</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 0; padding: 1.5rem; max-width: 900px; margin-inline: auto; line-height: 1.4; }
  h1 { font-size: 1.1rem; margin: 0 0 1rem; }
  h2 { font-size: 0.95rem; margin: 1.5rem 0 0.5rem; }
  nav { font-size: 0.85rem; margin-bottom: 0.75rem; }
  nav a { margin-right: 1rem; }
  nav a.current { font-weight: 600; text-decoration: none; }
  form#connect { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
  form#connect input { flex: 1 1 200px; padding: 0.35rem 0.5rem; }
  #status { font-size: 0.85rem; color: #666; margin-bottom: 1rem; }
  .line { margin: 0.35rem 0; }
  .warn { color: #a15c00; font-weight: 600; }
  .ok { color: #0a7a2e; }
  .bad { color: #a11; font-weight: 600; }
  table { border-collapse: collapse; width: 100%; font-size: 0.85rem; margin-bottom: 1rem; }
  th, td { border: 1px solid #ccc; padding: 0.35rem 0.5rem; text-align: left; }
  .bar { background: rgba(0,0,0,0.08); border-radius: 4px; height: 0.6rem; overflow: hidden; margin-top: 0.25rem; }
  .bar-fill { background: #0a5c9c; height: 100%; }
  .note { font-size: 0.8rem; color: #888; }
</style>
</head>
<body>
<nav><a href="/">Board</a><a href="/audit.html">Audit</a><a href="/knowledge.html">Knowledge</a><a href="/procedures.html">Procedures</a><a href="/equip.html">Equip</a><a href="/members.html">Members</a><a class="current" href="/health.html">Health</a></nav>
<h1>fleetsmith grid — deployment health</h1>

<form id="connect">
  <input id="token" placeholder="bearer token" type="password" required />
  <input id="remote" placeholder="git remote URL (optional — enables the harness panel)" />
  <button type="submit">Load</button>
</form>

<div id="content" hidden>
  <div id="status"></div>

  <h2>Cortex</h2>
  <div id="cortex"></div>

  <h2>Harness</h2>
  <table>
    <thead><tr><th>Actor</th><th>State</th><th>Last successful sync</th></tr></thead>
    <tbody id="harness"></tbody>
  </table>
  <p class="note" id="harness-note"></p>
</div>

<script>
  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function bytesToGiB(n) {
    return (n / 1024 ** 3).toFixed(2);
  }

  function renderCortex(engineStatus, storage, license, warnings) {
    const lines = [];
    if (engineStatus) {
      lines.push(`<div class="line">profile: <b>${escapeHtml(engineStatus.profile)}</b> · role: ${escapeHtml(engineStatus.role)} · uptime: ${Math.round(engineStatus.uptime_secs / 60)} min</div>`);
      lines.push(`<div class="line">active connections: ${engineStatus.active_connections} · query quota: ${engineStatus.query_quota} · ingested rows: ${engineStatus.ingested_rows}</div>`);
    } else {
      lines.push('<div class="line bad">engine status unavailable</div>');
    }

    if (storage.available) {
      const pct = storage.percentUsed;
      lines.push(`<div class="line">storage: ${bytesToGiB(storage.usedBytes)} GiB${storage.capBytes ? ` / ${bytesToGiB(storage.capBytes)} GiB (${pct}%)` : ' (no cap on this profile)'}</div>`);
      if (storage.capBytes) lines.push(`<div class="bar"><div class="bar-fill" style="width:${Math.min(pct, 100)}%"></div></div>`);
    } else {
      lines.push('<div class="line note">storage usage unavailable</div>');
    }

    if (license.configured) {
      const cls = license.warning ? 'warn' : 'ok';
      lines.push(`<div class="line ${cls}">${escapeHtml(license.message)}</div>`);
    } else {
      lines.push(`<div class="line note">license expiry not configured — this engine has no HTTP endpoint that reports it; set RELATA_LICENSE_EXPIRES_AT on the console if you want this warning${license.error ? `: ${escapeHtml(license.error)}` : ''}</div>`);
    }

    if (warnings?.length) lines.push(`<p class="note">${warnings.map(escapeHtml).join('<br>')}</p>`);
    document.getElementById('cortex').innerHTML = lines.join('');
  }

  function renderHarness(harness) {
    const el = document.getElementById('harness');
    const noteEl = document.getElementById('harness-note');
    if (harness.length === 0) {
      el.innerHTML = '';
      noteEl.textContent = 'no ?remote= given, or no known actors for this repo yet';
      return;
    }
    noteEl.textContent = '';
    el.innerHTML = harness
      .map((h) => {
        const cls = h.state === 'healthy' ? 'ok' : h.state === 'degraded' ? 'bad' : '';
        return `<tr><td>${escapeHtml(h.actor)}</td><td class="${cls}">${escapeHtml(h.state)}</td><td>${escapeHtml(h.lastSync ?? '(never completed a sync)')}</td></tr>`;
      })
      .join('');
  }

  document.getElementById('connect').addEventListener('submit', async (e) => {
    e.preventDefault();
    const token = document.getElementById('token').value.trim();
    const remote = document.getElementById('remote').value.trim();
    const statusEl = document.getElementById('status');
    if (!token) return;
    document.getElementById('content').hidden = false;
    try {
      const url = `/api/health/detail${remote ? `?remote=${encodeURIComponent(remote)}` : ''}`;
      const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
      const body = await res.json();
      if (!res.ok) {
        statusEl.textContent = `error: ${body.error ?? res.status}`;
        return;
      }
      statusEl.textContent = 'loaded';
      renderCortex(body.engineStatus, body.storage, body.license, body.warnings);
      renderHarness(body.harness);
    } catch (err) {
      statusEl.textContent = `error: ${err.message}`;
    }
  });
</script>
</body>
</html>
