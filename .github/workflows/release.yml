name: release

# Tag a version to cut a release:  git tag v0.2.0 && git push --tags
# Produces standalone binaries for linux/macos/windows and attaches them to
# a GitHub Release. npm publish runs only if repo variable PUBLISH_NPM=true
# and secret NPM_TOKEN is set.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Both macOS slices are built on the arm64 runner. The Intel `macos-13`
  # runner queued indefinitely and was cancelled at GitHub's 24h limit on every
  # release, which is how v0.3.0 shipped with no macOS x64 binary at all.
  # Injection is Mach-O surgery — postject never executes the target — so an
  # arm64 host can cross-build a working x86_64 binary from the official node.
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: fleetsmith-linux-x64
          - os: macos-latest
            asset: fleetsmith-macos-arm64
          - os: windows-latest
            asset: fleetsmith-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build:binary

      # RUN the thing we are about to publish.
      #
      # v0.7.0 shipped a binary that threw before executing any command, and
      # this job attached it to a release with every check green: `npm test`
      # exercises the ESM sources, where `import.meta.url` is defined, while the
      # binary is an esbuild CJS bundle where it is not. The suite cannot reach
      # that failure by construction, so the artifact has to be executed
      # directly or a dead binary looks exactly like a good one.
      - name: Smoke-test the binary
        run: npm run smoke:binary

      - name: Stage asset (unix)
        if: runner.os != 'Windows'
        run: cp dist/bin/fleetsmith "${{ matrix.asset }}"
      - name: Stage asset (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/bin/fleetsmith.exe "${{ matrix.asset }}"

      # Cross-build the Intel slice on the same runner.
      - name: Build macOS x64
        if: matrix.os == 'macos-latest'
        run: npm run build:binary:macos-x64
      # The Intel slice cannot be smoke-tested here — the runner is arm64 and
      # Rosetta is not guaranteed on it — so its guarantee is narrower on
      # purpose: the architecture is verified, and the CODE inside it is the
      # same bundle the arm64 slice just executed successfully, since both are
      # injected from one dist/fleetsmith.cjs.
      - name: Verify it really is x86_64
        if: matrix.os == 'macos-latest'
        run: |
          lipo -archs dist/bin/fleetsmith-x64 | grep -qx x86_64
          cp dist/bin/fleetsmith-x64 fleetsmith-macos-x64

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.os == 'macos-latest' && 'fleetsmith-macos-x64' || '' }}
          generate_release_notes: true

  npm:
    needs: binaries
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
